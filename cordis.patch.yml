# 模型目录面板：启动时拉取模型目录，按 id 同步积分倍率（写入 name）
# 与思考强度列表（写入 reasoningEfforts）到 llm-pi-ai 的指定模型组。
#
# 连接信息（接口地址 / API Key 引用 / 模型组）不在此处内置，统一在面板里配置：
# 左侧栏「模型目录」图标 → 连接配置 → 从已有模型组引入，或新建模型组。
# 密钥只保存到 DSH 凭据服务，不会写入插件状态或本文件。
- insert:
    - id: model-catalog
      name: dsh-model-catalog
      config:
        baseURL: ''
        apiKeyEnv: ''
        provider: ''
        providerDisplayName: ''
        providerApi: openai-completions
        createProvider: false
        # 可用变量：{prefix} {group} {name} {id} {credits} {description} {context} {maxTokens} {vendor} {tier}
        nameTemplate: '{prefix}{name} [{credits}]'
        # 启动时只刷新已导入模型的名称/积分/思考档位，不自动增删模型，
        # 避免覆盖面板里勾选出来的清单。
        syncOnStartup: true
        syncReasoningEfforts: true
        syncContextWindow: true
        requestTimeoutMs: 30000
